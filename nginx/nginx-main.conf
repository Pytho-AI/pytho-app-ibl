worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # X-Forwarded-Proto pass-through. Upstream proxies that terminated
    # TLS (e.g. AWS HTTPS reverse proxy in front of spark-dev) set
    # X-Forwarded-Proto: https on the request when forwarding plain HTTP
    # to us. We honor that header so downstream services (especially
    # Collabora coolwsd, which builds WebSocket URLs from the perceived
    # scheme) advertise wss:// — otherwise the browser blocks the
    # eventual ws:// connection as mixed content from an HTTPS page.
    # Falls back to $scheme (the listener's own scheme) for direct
    # connections that don't carry the header.
    map $http_x_forwarded_proto $real_scheme {
        default $scheme;
        https   https;
        http    http;
    }

    # NOTE — no tile cache here. Tile caching lives INSIDE the geo-agent
    # service (its internal tilecache container); all map/tile traffic
    # rides the /geo-api/ -> geo-agent forward.

    include /etc/nginx/conf.d/*.conf;
}
