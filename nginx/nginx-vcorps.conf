# Edge nginx conf. Mirrors nginx.cloud.conf / nginx.staging.conf on main
# block-for-block; the ONLY structural deltas are edge-specific responsibilities
# main doesn't have (SPA serving at /, /tiles/ tileserver, /chat/socket IRC,
# /cert CA download, /coder/ code-server) plus edge-specific env values
# (self-signed cert paths, catch-all server_name, no /editor/ agent_service
# catch-all because agent-memory-service is not deployed on spark).
#
# Everything else — upstream declarations, /api/ timeouts (60s connect + 3600s
# send/read/send), /files/ headers, /ws/ headers + 7d timeouts, /coa-* blocks,
# /geo-api/ rewrite pattern, /editor/* Collabora blocks with X-Frame-Options
# and Content-Security-Policy stripped — is byte-for-byte the main pattern.

upstream docker_api {
    server docker-api-vcorps:8000;
}

upstream geo_agent {
    # Standalone geo-agent over its host-published port — no shared docker
    # network. Requires host.docker.internal:host-gateway (extra_hosts).
    server host.docker.internal:9845;
}

upstream editor {
    # The shared Collabora editor lives in the IDX 26 stack; V Corps
    # reaches it over its host-published port — no shared docker network.
    server host.docker.internal:9980;
}

# Edge-only. Main doesn't run a tileserver — cloud tile serving is
# handled through the geo-agent map API (in progress). Kept here for
# now so edge's frontend keeps working; will retire when the unified
# /api/v1/tiles/ path lands.
# Edge-only. Ergo IRC WebSocket backend for the shared analyst chat panel.
upstream agent_chat {
    server agent-chat-vcorps:8097;
}

# HTTP server
server {
    listen 80;
    server_name _;

    # Edge has no Let's Encrypt path — self-signed cert baked into the image.
    # Redirect everything else to HTTPS.
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 100M;

    # Self-signed cert baked at image build time (nginx/ssl/{cert,key}.pem).
    # spark-dev is a dev box on Tailscale; clients accept the cert exception.
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Edge serves the SPA locally (main returns 404 at /).
    root /usr/share/nginx/html;

    # API routes
    location /api/ {
        proxy_pass http://docker_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    # Static files (uploaded documents)
    location /files/ {
        proxy_pass http://docker_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket routes
    location /ws/ {
        proxy_pass http://docker_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # NOTE — main has /coa-ws + /coa-api/ blocks proxying to a coa-engine
    # upstream (COA pipeline simulation service). coa-engine is not
    # deployed on edge; adding the upstream declaration would fail nginx
    # boot ("host not found in upstream"). Blocks omitted here.

    # NOTE — all map/tile traffic rides the single `/geo-api/` -> geo_agent
    # forward below. geo-agent is the ONE map endpoint; it owns its
    # tileserver and tile cache internally. nginx does not reach the
    # tileserver directly.

    # Geo-Agent WebSocket — realtime map updates from useGeoAgentRealtime.
    # Must precede the generic /geo-api/ block because HTTP-upgrade needs
    # the WS-specific headers + long read timeout. Rewrite maps
    # /geo-api/v1/ws → /api/v1/ws on the backend.
    location /geo-api/v1/ws {
        rewrite ^/geo-api/(.*) /api/$1 break;
        proxy_pass http://geo_agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Geo-Agent API routes
    # Proxies /geo-api/v1/... to geo-agent's /api/v1/...
    # Note: CORS headers are handled by geo-agent backend, not nginx
    location /geo-api/ {
        rewrite ^/geo-api/(.*) /api/$1 break;
        proxy_pass http://geo_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Geo-Agent frontend (React + Vite bundle served by geo-agent's own
    # FastAPI StaticFiles mount). pytho-app iframes this under
    # /geo-app/operations-map for the analyst surface. Built with
    # base=/geo-app/, so asset URLs are /geo-app/assets/... — no rewrite.
    location /geo-app/ {
        proxy_pass http://geo_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Collabora emits ABSOLUTE /browser/ /cool/ /hosting/ asset URLs in
    # cool.html. Route those at root alongside the /editor/* entry points.
    # (See nginx.edge.conf for the full comment.)
    location /browser/ {
        proxy_pass http://editor;
        proxy_set_header Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /hosting/ {
        proxy_pass http://editor;
        proxy_set_header Host $http_host;
    }

    location /cool/ {
        proxy_pass http://editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_read_timeout 7d;
    }

    location /coolws/ {
        proxy_pass http://editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 7d;
    }

    # Editor (Collabora) static assets — strip /editor prefix
    location /editor/browser/ {
        rewrite ^/editor/(.*) /$1 break;
        proxy_pass http://editor;
        proxy_set_header Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Editor (Collabora) WOPI discovery
    location /editor/hosting/ {
        rewrite ^/editor/(.*) /$1 break;
        proxy_pass http://editor;
        proxy_set_header Host $http_host;
    }

    # Editor (Collabora) WebSocket + cool endpoints
    location /editor/cool/ {
        rewrite ^/editor/(.*) /$1 break;
        proxy_pass http://editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_read_timeout 7d;
    }

    # NOTE — main has a `/editor/` catch-all here that forwards to
    # `agent_service` (agent-memory-service:7611) for the connect / read /
    # batch / view routes agent-memory-service owns. That container is not
    # deployed on edge (spark, vcorps), so declaring the upstream would fail
    # nginx boot and the catch-all would 502. Everything /editor/* not caught
    # by the three specific Collabora locations above falls through to the
    # SPA `location /` below and returns index.html — which is what the SPA
    # expects for client-routed paths.

    # ─────────────────────────────────────────────────────────────────────
    # Edge-only blocks below. Main doesn't have these; they land in the
    # unified map API + host-service integration passes.
    # ─────────────────────────────────────────────────────────────────────

    # Ergo IRC over WebSocket — LiveEditor per-doc analyst chat panel.
    location /chat/socket {
        proxy_pass http://agent_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # spark-dev self-signed root CA download — analysts on stock SCIF
    # laptops import this into Firefox's per-profile NSS store so code-server
    # webviews can register ServiceWorkers.
    location = /cert {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="spark-code-server.crt"';
        return 200 "-----BEGIN CERTIFICATE-----
MIIDYDCCAkigAwIBAgIUCvKWl1wdhkzNEhK1RWZT5+NFSgEwDQYJKoZIhvcNAQEL
BQAwHTEbMBkGA1UEAwwSc3BhcmstZGV2IElCTCBTQ0lGMB4XDTI2MDYwNDE3Mjkw
