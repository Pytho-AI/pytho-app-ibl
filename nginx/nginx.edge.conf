# Edge nginx conf — and THE ROUTING REFERENCE for every deployment target.
#
# This file's routing is AHEAD of main's nginx.cloud.conf/nginx.staging.conf
# (which ibl deleted): the geo-agent map unification lives here and not yet
# there — `upstream geo_agent { host.docker.internal:9845 }` (decoupled host
# port, no shared docker network), `location /geo-app/` (embedded map UI),
# `location /geo-api/v1/ws` (map WebSocket), `location /geo-api/` (rewrite).
# The cloud variant lives HERE on ibl as a sibling — nginx/nginx.cloud.conf
# (ibl supports BOTH deployment targets; features port to main piecemeal).
# It was REGENERATED by copying this file's server blocks — never re-author
# routing in either file without mirroring — with only these per-target
# deltas:
#   cloud/staging: real cert paths + internalapi/stagingapi server_name;
#     re-add coa-engine upstreams + /coa-ws + /coa-api blocks and the
#     /editor/ agent_service catch-all (those hosts run there; declaring an
#     upstream for an undeployed host fails nginx boot, which is why edge
#     omits them); drop the edge-only blocks below.
#   edge-only responsibilities (stay out of cloud): SPA serving at /,
#     /chat/socket IRC, /cert CA download, /coder/ code-server, self-signed
#     cert paths, catch-all server_name.
#
# Everything else — upstream declarations, /api/ timeouts (60s connect + 3600s
# send/read/send), /files/ headers, /ws/ headers + 7d timeouts,
# /geo-api/ rewrite pattern, /editor/* Collabora blocks with X-Frame-Options
# and Content-Security-Policy stripped — is the shared pattern, identical
# across targets.

# Target the `docker-api-primary` alias, NOT the bare `docker-api`. Both
# compose projects put a `docker-api` alias on the shared pytho-net (IDX 26
# primary + a stale one on docker-api-vcorps), so `docker-api` resolves to
# TWO backend IPs and nginx round-robins the upstream — ~50% of /api calls
# land on the V Corps backend (separate Postgres) and return "product not
# found." `docker-api-primary` is aliased ONLY to the IDX 26 docker-api
# (see docker-compose-edge.yml), so it resolves uniquely to this stack.
upstream docker_api {
    server docker-api-primary:8000;
}

upstream geo_agent {
    # geo-agent is a standalone service reached over its host-published
    # port, NOT a shared docker network. Any stack (edge, vcorps, cloud)
    # talks to it the same way. Requires host.docker.internal:host-gateway
    # (set via extra_hosts on this container in the compose).
    server host.docker.internal:9845;
}

upstream editor {
    server agent-editor:9980;
}

# Ergo IRC WebSocket backend for the shared analyst chat panel.
upstream agent_chat {
    server agent-chat:8097;
}

# HTTP server
server {
    listen 80;
    server_name _;

    # Edge has no Let's Encrypt path — self-signed cert baked into the image.
    # Redirect everything else to HTTPS.
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 100M;

    # Self-signed cert baked at image build time (nginx/ssl/{cert,key}.pem).
    # spark-dev is a dev box on Tailscale; clients accept the cert exception.
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Edge serves the SPA locally (main returns 404 at /).
    root /usr/share/nginx/html;

    # API routes
    location /api/ {
        proxy_pass http://docker_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    # Static files (uploaded documents)
    location /files/ {
        proxy_pass http://docker_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket routes
    location /ws/ {
        proxy_pass http://docker_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # NOTE — main has /coa-ws + /coa-api/ blocks proxying to a coa-engine
    # upstream (COA pipeline simulation service). coa-engine is not
    # deployed on edge; adding the upstream declaration would fail nginx
    # boot ("host not found in upstream"). Blocks omitted here.

    # NOTE — all map/tile traffic (basemap rasters, vector .pbf, ESRI
    # satellite, labels) rides the single `/geo-api/` -> geo_agent forward
    # below. geo-agent is the ONE map endpoint; it owns its tileserver and
    # its own tile cache internally. nginx does NOT reach the tileserver
    # directly and does NOT cache tiles — that coupling was removed.

    # Geo-Agent WebSocket — realtime map updates from useGeoAgentRealtime.
    # Must precede the generic /geo-api/ block because HTTP-upgrade needs
    # the WS-specific headers + long read timeout. Rewrite maps
    # /geo-api/v1/ws → /api/v1/ws on the backend.
    location /geo-api/v1/ws {
        rewrite ^/geo-api/(.*) /api/$1 break;
        proxy_pass http://geo_agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Geo-Agent API routes
    # Proxies /geo-api/v1/... to geo-agent's /api/v1/...
    # Note: CORS headers are handled by geo-agent backend, not nginx
    location /geo-api/ {
        rewrite ^/geo-api/(.*) /api/$1 break;
        proxy_pass http://geo_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Geo-Agent frontend (React + Vite bundle served by geo-agent's own
    # FastAPI StaticFiles mount). Analyst-facing map UI + Playwright's
    # headless screenshot target both live here. pytho-app iframes this
    # under /geo-app/operations-map for the analyst surface; Playwright
    # loads /geo-app/headless directly for product-artifact renders.
    #
    # No path rewrite — the frontend was built with base=/geo-app/, so
    # asset URLs in index.html are /geo-app/assets/...
    location /geo-app/ {
        proxy_pass http://geo_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Collabora emits ABSOLUTE asset URLs (`/browser/...`, `/hosting/...`,
    # `/cool/...`) in cool.html + discovery.xml regardless of net.service_root
    # setting. When the analyst loads /editor/browser/dist/cool.html, the
    # HTML contains <script src="/browser/a9b866688f/bundle.js">, and the
    # browser fetches that against the domain root — bypassing /editor/.
    # So we also route the root paths to the editor container. Same behavior,
    # two entry points: /editor/browser/dist/cool.html (frontend-minted URL)
    # AND /browser/... (Collabora-embedded asset URLs from that page).
    location /browser/ {
        proxy_pass http://editor;
        proxy_set_header Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /hosting/ {
        proxy_pass http://editor;
        proxy_set_header Host $http_host;
    }

    location /cool/ {
        proxy_pass http://editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_read_timeout 7d;
    }

    location /coolws/ {
        proxy_pass http://editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 7d;
    }

    # Editor (Collabora) static assets — strip /editor prefix
    location /editor/browser/ {
        rewrite ^/editor/(.*) /$1 break;
        proxy_pass http://editor;
        proxy_set_header Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Editor (Collabora) WOPI discovery
    location /editor/hosting/ {
        rewrite ^/editor/(.*) /$1 break;
        proxy_pass http://editor;
        proxy_set_header Host $http_host;
    }

    # Editor (Collabora) WebSocket + cool endpoints
    location /editor/cool/ {
        rewrite ^/editor/(.*) /$1 break;
        proxy_pass http://editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_read_timeout 7d;
    }

    # NOTE — main has a `/editor/` catch-all here that forwards to
    # `agent_service` (agent-memory-service:7611) for the connect / read /
    # batch / view routes agent-memory-service owns. That container is not
    # deployed on edge (spark, vcorps), so declaring the upstream would fail
    # nginx boot and the catch-all would 502. Everything /editor/* not caught
    # by the three specific Collabora locations above falls through to the
    # SPA `location /` below and returns index.html — which is what the SPA
    # expects for client-routed paths.

    # ─────────────────────────────────────────────────────────────────────
    # Edge-only blocks below. Main doesn't have these; they land in the
    # unified map API + host-service integration passes.
    # ─────────────────────────────────────────────────────────────────────

    # Ergo IRC over WebSocket — LiveEditor per-doc analyst chat panel.
    location /chat/socket {
        proxy_pass http://agent_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # spark-dev self-signed root CA download — analysts on stock SCIF
    # laptops import this into Firefox's per-profile NSS store so code-server
    # webviews can register ServiceWorkers.
    location = /cert {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="spark-code-server.crt"';
        return 200 "-----BEGIN CERTIFICATE-----
MIIDYDCCAkigAwIBAgIUCvKWl1wdhkzNEhK1RWZT5+NFSgEwDQYJKoZIhvcNAQEL
BQAwHTEbMBkGA1UEAwwSc3BhcmstZGV2IElCTCBTQ0lGMB4XDTI2MDYwNDE3Mjkw
