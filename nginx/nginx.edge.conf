";
    }

    # Code-server (Cline IDE) — proxied from host localhost:8444 under /coder/.
    # 172.19.0.1 is the pytho-net gateway (host machine).
    location /coder/ {
        rewrite ^/coder/(.*) /$1 break;
        proxy_pass http://172.19.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # SPA fallback. Edge serves the built React frontend at /; main returns 404.
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
