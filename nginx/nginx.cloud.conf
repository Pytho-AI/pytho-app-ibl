# Cloud nginx conf — ONE file for BOTH cloud boxes (production
# internalapi.pytho.ai and staging stagingapi.pytho.ai). Each box serves
# exactly one hostname and mounts its own Let's Encrypt certs at the
# same in-container paths, so `server_name _` (catch-all) serves both
# byte-identically; there is deliberately NO separate staging conf (the
# old main-branch nginx.cloud.conf/nginx.staging.conf pair differed by
# nothing but the server_name string).
#
# REGENERATED from nginx.edge.conf — THE routing reference; never
# re-author routing here. Per-target deltas versus edge, all documented
# in the edge conf header:
#   - real certs (/etc/nginx/certs/, box mount) + Let's Encrypt webroot
#     instead of the baked self-signed pair;
#   - coa-engine upstreams + /coa-ws + /coa-api/ blocks present (cloud
#     runs coa-engine; edge omits them because an upstream for an
#     undeployed host fails nginx boot);
#   - /editor/ agent_service catch-all present (cloud runs
#     agent-memory-service);
#   - bare `docker-api` upstream (single stack on this box — the
#     docker-api-primary alias exists only for the edge/vcorps
#     shared-network collision);
#   - NO edge-only blocks: no SPA at / (pytho-vite serves the frontend
#     via SST; / returns 404), no /chat/socket, no /cert, no /coder/.
#
# geo-agent is a STANDALONE service reached over its host-published
# port — same consumer contract as every other stack. All map/tile
# traffic rides /geo-api/ + /geo-app/; nginx never reaches geo-agent's
# tileserver and never caches tiles.

upstream docker_api {
    server docker-api:8000;
}

upstream coa_engine {
    server coa-engine:8765;
}

upstream coa_engine_http {
    server coa-engine:8766;
}

upstream geo_agent {
    # geo-agent is a standalone service reached over its host-published
    # port, NOT a shared docker network. Any stack (edge, vcorps, cloud)
    # talks to it the same way. Requires host.docker.internal:host-gateway
    # (set via extra_hosts on this container in the compose).
    server host.docker.internal:9845;
}

upstream editor {
    server agent-editor:9980;
}

upstream agent_service {
    server agent-memory-service:7611;
}

# HTTP server
server {
    listen 80;
    server_name _;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 100M;

    # Per-box Let's Encrypt certs, mounted from the EC2 instance
    # (../certs in the compose).
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # API routes
    location /api/ {
        proxy_pass http://docker_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    # Static files (uploaded documents)
    location /files/ {
        proxy_pass http://docker_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket routes
    location /ws/ {
        proxy_pass http://docker_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # COA Engine WebSocket
    location /coa-ws {
        proxy_pass http://coa_engine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # COA Engine HTTP API
    # CORS headers are handled by the backend (cors_middleware in http_server.py)
    location /coa-api/ {
        rewrite ^/coa-api/(.*) /$1 break;
        proxy_pass http://coa_engine_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Geo-Agent WebSocket — realtime map updates from useGeoAgentRealtime.
    # Must precede the generic /geo-api/ block because HTTP-upgrade needs
    # the WS-specific headers + long read timeout. Rewrite maps
    # /geo-api/v1/ws → /api/v1/ws on the backend.
    location /geo-api/v1/ws {
        rewrite ^/geo-api/(.*) /api/$1 break;
        proxy_pass http://geo_agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Geo-Agent API routes
    # Proxies /geo-api/v1/... to geo-agent's /api/v1/...
    # Note: CORS headers are handled by geo-agent backend, not nginx
    location /geo-api/ {
        rewrite ^/geo-api/(.*) /api/$1 break;
        proxy_pass http://geo_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Geo-Agent frontend (React + Vite bundle served by geo-agent's own
    # FastAPI StaticFiles mount). Analyst-facing map UI + Playwright's
    # headless screenshot target both live here. The pytho-vite SPA
    # iframes /geo-app/operations-map for the analyst surface.
    #
    # No path rewrite — the frontend was built with base=/geo-app/, so
    # asset URLs in index.html are /geo-app/assets/...
    location /geo-app/ {
        proxy_pass http://geo_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Collabora emits ABSOLUTE asset URLs (`/browser/...`, `/hosting/...`,
    # `/cool/...`) in cool.html + discovery.xml regardless of net.service_root
    # setting. When the analyst loads /editor/browser/dist/cool.html, the
    # HTML contains <script src="/browser/a9b866688f/bundle.js">, and the
    # browser fetches that against the domain root — bypassing /editor/.
    # So we also route the root paths to the editor container. Same behavior,
    # two entry points: /editor/browser/dist/cool.html (frontend-minted URL)
    # AND /browser/... (Collabora-embedded asset URLs from that page).
    location /browser/ {
        proxy_pass http://editor;
        proxy_set_header Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /hosting/ {
        proxy_pass http://editor;
        proxy_set_header Host $http_host;
    }

    location /cool/ {
        proxy_pass http://editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_read_timeout 7d;
    }

    location /coolws/ {
        proxy_pass http://editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 7d;
    }

    # Editor (Collabora) static assets — strip /editor prefix
    location /editor/browser/ {
        rewrite ^/editor/(.*) /$1 break;
        proxy_pass http://editor;
        proxy_set_header Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Editor (Collabora) WOPI discovery
    location /editor/hosting/ {
        rewrite ^/editor/(.*) /$1 break;
        proxy_pass http://editor;
        proxy_set_header Host $http_host;
    }

    # Editor (Collabora) WebSocket + cool endpoints
    location /editor/cool/ {
        rewrite ^/editor/(.*) /$1 break;
        proxy_pass http://editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_read_timeout 7d;
    }

    # Agent service editor endpoints (connect, read, batch, view, etc.)
    # Catch-all for /editor/* not matched by the more specific Collabora
    # locations above. CORS is handled by memory_service's CORSMiddleware.
    location /editor/ {
        proxy_pass http://agent_service/editor/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # No frontend on this host — pytho-vite serves the SPA via SST.
    location / {
        return 404;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
